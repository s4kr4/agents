[project]
name = "shared-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.1", "PyYAML==6.0.2", "tomlkit==0.15.1"]

[dependency-groups]
dev = ["ruff==0.16.6", "mypy==2.3.1", "types-PyYAML==6.0.12.20260815"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
