# Claude Code のグローバル設定との対応:
# - language/outputStyle → AGENTS.md の日本語・説明的な応答方針
# - CLAUDE.md → プロジェクト指示のフォールバック名
approval_policy = "never"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
model_verbosity = "medium"
vim_mode_default = true

[sandbox_workspace_write]
network_access = true

[permissions.project-edit]
description = "Workspace editing with Claude-compatible secret-file denials"
extends = ":workspace"

[permissions.project-edit.filesystem]
glob_scan_max_depth = 12

[permissions.project-edit.filesystem.":workspace_roots"]
".git" = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"
"**/secrets/**" = "deny"

[agents]
max_threads = 4
max_depth = 1

[features]
hooks = true
multi_agent = true

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_condition = "always"

[projects."/home/s4kr4/.agents"]
trust_level = "trusted"
